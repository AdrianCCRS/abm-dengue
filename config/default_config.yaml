simulation:
  steps: 364
  width: 150
  height: 150
  num_humanos: 10000
  num_mosquitos: 1500
  num_huevos: 50
  infectados_iniciales: 297  # Casos reales de dengue en 2021 (SIVIGILA Bucaramanga)
  mosquitos_infectados_iniciales: 12
  usar_lsm: false
  usar_itn_irs: false
  seed: null      # dejar aleatoria para explorar variabilidad

human_disease:
  incubation_period: 5.0        # igual
  infectious_period: 8.0        # antes 9: brote aún fuerte, pero un poco menos prolongado
  immunity_loss_prob: 0.005     # 0.5% diario = ~18% anual de pérdida de inmunidad (R→S)

mosquito_disease:
  mortality_rate: 0.10          # Vida ~10 días (año endémico)
  sensory_range: 2
  incubation_period: 10         # EIP = 10 días
  carrying_capacity_per_cell: 3000

transmission:
  mosquito_to_human_prob: 0.30  # Reducido fuertemente para año endémico
  human_to_mosquito_prob: 0.35  # Reducido para controlar pico
  bite_rate: 0.5                # Reducido para transmisión más moderada
  vertical_transmission_rate: 0.18  # 18% (máximo científico, Gunther 2007)

mobility:
  student_daily_probabilities:
    home: 0.55
    destination: 0.35
    park: 0.10
  
  worker_daily_probabilities:
    home: 0.60
    destination: 0.35
    park: 0.05
  
  mobile_daily_probabilities:
    home: 0.45      # antes 0.40 → un pelín más caseros
    destination: 0.0
    park: 0.15      # antes 0.20
    random: 0.40
  
  stationary_daily_probabilities:
    home: 0.95
    destination: 0.0
    park: 0.05
    random: 0.0

mosquito_breeding:
  eggs_per_female: 25          # Reducido para controlar población
  mating_probability: 0.6       # AUMENTADO: más hembras se aparean
  female_ratio: 0.52
  immature_development_threshold: 8.3
  immature_thermal_constant: 181.2
  rainfall_threshold: 0.0
  breeding_site_ratio: 0.10    # 10% de celdas con agua

  gonotrophic_cycle_days: 3    # REDUCIDO: ponen huevos más frecuente

  egg_mortality_rate: 0.30     # Aumentado para controlar población

  temporary_sites:
    min_rainfall: 5.0
    sites_per_mm: 0.30         # antes 0.5 → menos charcos por mm de lluvia
    duration_days: 6           # antes 7 → charcos duran un poco menos
    max_sites: 80              # antes 100

population:
  mobility_distribution:
    student: 0.30
    worker: 0.40
    mobile: 0.20
    stationary: 0.10

environment:
  cell_types:
    water_ratio: 0.05
    park_ratio: 0.10
  zone_sizes:
    water_min: 2
    water_max: 4
    park_min: 3
    park_max: 6
  mosquito_flight:
    max_range: 5
  grid_generation:
    max_placement_failures: 50
    max_total_attempts: 500

control:
  lsm:
    frequency_days: 7
    coverage: 0.7
    effectiveness: 0.8
  itn_irs:
    duration_days: 90
    coverage: 0.6
    effectiveness: 0.7

human_behavior:
  isolation_probability: 0.6     # Aumentado para reducir transmisión
  infected_mobility_radius: 1

climate_effects:
  # Rangos de temperatura (°C)
  temperature_optimal_min: 25
  temperature_optimal_max: 30
  temperature_extreme_cold: 10
  temperature_extreme_heat: 40
  temperature_suboptimal_cold: 15
  temperature_suboptimal_heat: 35
  
  # Multiplicadores de mortalidad
  mosquito_mortality_extreme_multiplier: 2.5
  mosquito_mortality_suboptimal_multiplier: 1.5
  
  # Mortalidad de huevos
  egg_mortality_extreme_cold: 0.90  # 90%
  egg_mortality_extreme_heat: 0.80  # 80%
  egg_mortality_suboptimal: 0.50    # 50%