simulation:
  steps: 364
  width: 150
  height: 150
  num_humanos: 10000
  num_mosquitos: 1500
  num_huevos: 50
  infectados_iniciales: 20
  mosquitos_infectados_iniciales: 12
  usar_lsm: false
  usar_itn_irs: false
  seed: null      # dejar aleatoria para explorar variabilidad

human_disease:
  incubation_period: 5.0        # igual
  infectious_period: 8.0        # antes 9: brote aún fuerte, pero un poco menos prolongado
  immunity_loss_prob: 0.005     # 0.5% diario = ~18% anual de pérdida de inmunidad (R→S)

mosquito_disease:
  mortality_rate: 0.06          # REDUCIDO: vida ~16.7 días (balance crítico)
  sensory_range: 2
  incubation_period: 10         # EIP = 10 días
  carrying_capacity_per_cell: 3000

transmission:
  mosquito_to_human_prob: 0.6   # AUMENTADO: más transmisión
  human_to_mosquito_prob: 0.45  # AUMENTADO: más mosquitos se infectan
  bite_rate: 0.7                # AUMENTADO: más picaduras
  vertical_transmission_rate: 0.18  # 18% (máximo científico, Gunther 2007)

mobility:
  student_daily_probabilities:
    home: 0.55
    destination: 0.35
    park: 0.10
  
  worker_daily_probabilities:
    home: 0.60
    destination: 0.35
    park: 0.05
  
  mobile_daily_probabilities:
    home: 0.45      # antes 0.40 → un pelín más caseros
    destination: 0.0
    park: 0.15      # antes 0.20
    random: 0.40
  
  stationary_daily_probabilities:
    home: 0.95
    destination: 0.0
    park: 0.05
    random: 0.0

mosquito_breeding:
  eggs_per_female: 35          # SEGÚN DOCUMENTO: 50 huevos/hembra/ciclo
  mating_probability: 0.6       # AUMENTADO: más hembras se aparean
  female_ratio: 0.52
  immature_development_threshold: 8.3
  immature_thermal_constant: 181.2
  rainfall_threshold: 0.0
  breeding_site_ratio: 0.10    # 10% de celdas con agua

  gonotrophic_cycle_days: 3    # REDUCIDO: ponen huevos más frecuente

  egg_mortality_rate: 0.20     # REDUCIDO: más huevos sobreviven

  temporary_sites:
    min_rainfall: 5.0
    sites_per_mm: 0.30         # antes 0.5 → menos charcos por mm de lluvia
    duration_days: 6           # antes 7 → charcos duran un poco menos
    max_sites: 80              # antes 100

population:
  mobility_distribution:
    student: 0.30
    worker: 0.40
    mobile: 0.20
    stationary: 0.10

environment:
  cell_types:
    water_ratio: 0.05
    park_ratio: 0.10
  zone_sizes:
    water_min: 2
    water_max: 4
    park_min: 3
    park_max: 6
  mosquito_flight:
    max_range: 5
  grid_generation:
    max_placement_failures: 50
    max_total_attempts: 500

control:
  lsm:
    frequency_days: 7
    coverage: 0.7
    effectiveness: 0.8
  itn_irs:
    duration_days: 90
    coverage: 0.6
    effectiveness: 0.7

human_behavior:
  isolation_probability: 0.3     # antes 0.7
  infected_mobility_radius: 1
