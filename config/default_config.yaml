simulation:
  steps: 364
  width: 150
  height: 150
  num_humanos: 7000
  num_mosquitos: 1500
  num_huevos: 50
  infectados_iniciales: 20
  mosquitos_infectados_iniciales: 12
  usar_lsm: false
  usar_itn_irs: false
  seed: null      # dejar aleatoria para explorar variabilidad

human_disease:
  incubation_period: 5.0        # igual
  infectious_period: 8.0        # antes 9: brote aún fuerte, pero un poco menos prolongado

mosquito_disease:
  mortality_rate: 0.05          # μ_m = 0.05 (vida media ~20 días, según documento)
  sensory_range: 2              # antes 3 → contacto más local
  incubation_period: 10         # EIP = 10 días (según documento)
  carrying_capacity_per_cell: 3000

transmission:
  mosquito_to_human_prob: 0.4   # antes 0.6
  human_to_mosquito_prob: 0.25  # antes 0.375
  bite_rate: 0.5                # antes 0.7 (~1 comida cada 2 días aprox.)
  vertical_transmission_rate: 0.10  # 10% transmisión madre→cría (rango científico: 1-18%, Gunther 2007)

mobility:
  student_daily_probabilities:
    home: 0.55
    destination: 0.35
    park: 0.10
  
  worker_daily_probabilities:
    home: 0.60
    destination: 0.35
    park: 0.05
  
  mobile_daily_probabilities:
    home: 0.45      # antes 0.40 → un pelín más caseros
    destination: 0.0
    park: 0.15      # antes 0.20
    random: 0.40
  
  stationary_daily_probabilities:
    home: 0.95
    destination: 0.0
    park: 0.05
    random: 0.0

mosquito_breeding:
  eggs_per_female: 50          # SEGÚN DOCUMENTO: 50 huevos/hembra/ciclo
  mating_probability: 0.6
  female_ratio: 0.52
  immature_development_threshold: 8.3
  immature_thermal_constant: 181.2
  rainfall_threshold: 0.0
  breeding_site_ratio: 0.10    # 10% de celdas con agua

  gonotrophic_cycle_days: 4    # Ciclo gonotrófico = 4 días (según documento)

  egg_mortality_rate: 0.25     # Mortalidad de huevos

  temporary_sites:
    min_rainfall: 5.0
    sites_per_mm: 0.30         # antes 0.5 → menos charcos por mm de lluvia
    duration_days: 6           # antes 7 → charcos duran un poco menos
    max_sites: 80              # antes 100

population:
  mobility_distribution:
    student: 0.30
    worker: 0.40
    mobile: 0.20
    stationary: 0.10

environment:
  cell_types:
    water_ratio: 0.05
    park_ratio: 0.10
  zone_sizes:
    water_min: 2
    water_max: 4
    park_min: 3
    park_max: 6
  mosquito_flight:
    max_range: 5
  grid_generation:
    max_placement_failures: 50
    max_total_attempts: 500

control:
  lsm:
    frequency_days: 7
    coverage: 0.7
    effectiveness: 0.8
  itn_irs:
    duration_days: 90
    coverage: 0.6
    effectiveness: 0.7

human_behavior:
  isolation_probability: 0.3     # antes 0.7
  infected_mobility_radius: 1
