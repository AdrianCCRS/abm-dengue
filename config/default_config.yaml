simulation:
  steps: 364
  width: 150
  height: 150
  num_humanos: 7000
  num_mosquitos: 1500
  num_huevos: 500
  infectados_iniciales: 20
  mosquitos_infectados_iniciales: 12
  usar_lsm: false
  usar_itn_irs: false
  seed: null      # dejar aleatoria para explorar variabilidad

human_disease:
  incubation_period: 5.0        # igual
  infectious_period: 8.0        # antes 9: brote aún fuerte, pero un poco menos prolongado

mosquito_disease:
  mortality_rate: 0.07          # antes 0.08 → un poco menos mortal
  sensory_range: 2              # lo dejamos reducido (2) para no hipermezclar
  incubation_period: 10         # igual
  carrying_capacity_per_cell: 3000  # antes 10000 → más acorde con docstring del grid

transmission:
  mosquito_to_human_prob: 0.65      # antes 0.4 → leve aumento, sin ser explosivo
  human_to_mosquito_prob: 0.33      # antes 0.25 → más infecciones de mosquitos
  bite_rate: 0.65                   # antes 0.5 → más picaduras, pero no tan alto como 0.7             # antes 0.7 (~1 comida cada 2 días aprox.)

mobility:
  student_daily_probabilities:
    home: 0.55
    destination: 0.35
    park: 0.10
  
  worker_daily_probabilities:
    home: 0.60
    destination: 0.35
    park: 0.05
  
  mobile_daily_probabilities:
    home: 0.45      # antes 0.40 → un pelín más caseros
    destination: 0.0
    park: 0.15      # antes 0.20
    random: 0.40
  
  stationary_daily_probabilities:
    home: 0.95
    destination: 0.0
    park: 0.05
    random: 0.0

mosquito_breeding:
  eggs_per_female: 35          # antes 25 → más cría, pero no tanto como 50
  mating_probability: 0.6
  female_ratio: 0.52

  immature_development_threshold: 8.3
  immature_thermal_constant: 181.2
  rainfall_threshold: 0.0

  breeding_site_ratio: 0.15    # antes 0.10 → más sitios permanentes, pero menos que 0.20

  gonotrophic_cycle_days: 3    # antes 5 → ponen huevos un poco más frecuente

  egg_mortality_rate: 0.20     # antes 0.35 → menos mortalidad, pero más que el 0.25 inicial

  temporary_sites:
    min_rainfall: 5.0
    sites_per_mm: 0.40         # antes 0.30 (y antes 0.50) → valor intermedio
    duration_days: 7           # antes 6 → charcos duran un poco más
    max_sites: 90              # antes 80 (y antes 100)

population:
  mobility_distribution:
    student: 0.30
    worker: 0.40
    mobile: 0.20
    stationary: 0.10

environment:
  cell_types:
    water_ratio: 0.05
    park_ratio: 0.10
  zone_sizes:
    water_min: 2
    water_max: 4
    park_min: 3
    park_max: 6
  mosquito_flight:
    max_range: 5
  grid_generation:
    max_placement_failures: 50
    max_total_attempts: 500

control:
  lsm:
    frequency_days: 7
    coverage: 0.7
    effectiveness: 0.8
  itn_irs:
    duration_days: 90
    coverage: 0.6
    effectiveness: 0.7

human_behavior:
  isolation_probability: 0.3     # antes 0.7
  infected_mobility_radius: 1

serotypes:
  enabled: true
  num_serotypes: 4
  cross_immunity_duration_days: 75  # ~2.5 meses de inmunidad cruzada temporal
  initial_distribution: [0.25, 0.25, 0.25, 0.25]  # DENV-1, DENV-2, DENV-3, DENV-4

climate_effects:
  # Rangos de temperatura óptima y extrema (°C)
  temperature_optimal_min: 25
  temperature_optimal_max: 30
  temperature_extreme_cold: 10  # Mortalidad muy alta
  temperature_extreme_heat: 40  # Mortalidad muy alta
  temperature_suboptimal_cold: 15  # Mortalidad moderada
  temperature_suboptimal_heat: 35  # Mortalidad moderada
  
  # Multiplicadores de mortalidad de mosquitos adultos
  mosquito_mortality_extreme_multiplier: 2.5  # T < 10°C o T > 40°C
  mosquito_mortality_suboptimal_multiplier: 1.5  # T < 15°C o T > 35°C
  
  # Mortalidad de huevos por temperatura
  egg_mortality_extreme_cold: 0.90  # 90% mueren si T < 10°C
  egg_mortality_extreme_heat: 0.80  # 80% mueren si T > 40°C
  egg_mortality_suboptimal: 0.50    # 50% mueren si 10°C < T < 15°C o 35°C < T < 40°C
